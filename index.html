<!doctype html>
<html lang="en">
  <head>
    <!-- BASIC -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- TITLE (very important)
         Keep in sync with HOME_SEO in src/data/seoRoutes.ts — scripts/prerenderSpa.ts
         overwrites this tag with that value at build time, so a mismatch here only
         shows up in dev.
         Species-first, brand last: "Dog & Cat Grooming" is the highest-volume
         phrasing and the opening of the tag carries the most weight. 55 chars,
         so it renders in full rather than truncating. -->
    <title>Dog &amp; Cat Grooming at Home in Pune | From ₹799 | Sniffy</title>

    <!-- META DESCRIPTION -->
    <meta
      name="description"
      content="Book dog grooming or cat grooming at home in Pune from ₹799. A trained groomer comes to your door across 33 localities — no salon, no travel, one visit."
    />

    <!-- SEO -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sniffy.in/" />

    <!-- LOCAL SEO -->
    <meta name="geo.region" content="IN-MH" />
    <meta name="geo.placename" content="Pune" />

    <!-- FAVICON -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96"/>
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- PWA / INSTALLABLE APP -->
    <!-- Android: tints the status bar to match the brand. -->
    <meta name="theme-color" content="#451a8b" />
    <!-- iOS Safari: lets the page run in standalone (no Safari chrome) when
         added to the Home Screen, and pins the home-screen tile label. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sniffy" />
    <meta name="application-name" content="Sniffy" />

    <!-- OPEN GRAPH (WhatsApp / Social) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dog &amp; Cat Grooming at Home in Pune | From ₹799 | Sniffy" />
    <meta
      property="og:description"
      content="Book dog grooming or cat grooming at home in Pune from ₹799. A trained groomer comes to your door across 33 localities — no salon, no travel, one visit."
    />
    <meta property="og:url" content="https://sniffy.in/" />
    <meta property="og:image" content="https://sniffy.in/sniffy-logo.png" />
    <meta property="og:site_name" content="Sniffy" />

    <!-- ============================================================
         PERFORMANCE — resource hints (zero SEO impact)
         ============================================================ -->

    <!-- Open TCP+TLS connections early to hosts the app uses at runtime.
         Note: the app ships NO web fonts (system font stack + Georgia), so
         there are deliberately no fonts.googleapis/gstatic hints here —
         preconnecting to unused origins only wastes the connection budget. -->
    <!-- WeatherWidget calls Open-Meteo on dashboard load. Warming the TCP+TLS
         handshake here saves ~100-300 ms off the first weather paint. -->
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />

    <!-- Faster DNS for any remaining external hosts -->
    <link rel="dns-prefetch" href="https://api.open-meteo.com" />

    <!--
      Preload the first hero slide image — it is the LCP element on both
      mobile and desktop (the full-bleed doorstep hero card). Browser fetches
      it in parallel with the JS bundle instead of waiting for React to mount.
      fetchpriority="high" treats it above other images; the matching <img>
      in HeroCarousel also carries fetchPriority="high" so the hint isn't
      wasted on a duplicate lower-priority request.

      Points at the .webp variant (25-35% smaller than the .jpg) to match the
      <picture><source type="image/webp"> HeroCarousel now renders. The
      type="image/webp" attribute makes browsers without webp support skip
      this preload entirely rather than fetch a resource they can't use —
      those browsers fall back to the .jpg via the <picture> element itself.
    -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero-lead.webp"
      imagesrcset="/images/hero-lead-800.webp 800w, /images/hero-lead.webp 1200w"
      imagesizes="(max-width: 767px) calc(100vw - 40px), (max-width: 1319px) calc(100vw - 44px), 1236px"
      fetchpriority="high"
    />

    <!-- ============================================================ -->

    <!-- ============================================================
         STRUCTURED DATA (LOCAL BUSINESS + WEBSITE)

         @type MUST be a real schema.org type. This node used to declare
         "PetGrooming", which does not exist (schema.org/PetGrooming is a
         404) — an unrecognised @type makes a parser fall back to a bare
         Thing, so the telephone, address, opening hours, price range and
         rating below were all being read as properties of nothing. There
         is no pet-grooming subtype in the vocabulary; LocalBusiness is the
         correct generic. (ProfessionalService looks like a better fit but
         is deprecated — schema.org retired it for being confused with
         Service.)

         LocalBusiness is itself a subtype of Organization, so the brand
         signals — logo, sameAs, contactPoint — belong on THIS node rather
         than a second Organization node. Splitting them would describe two
         entities to a crawler where the business is one.

         The old "serviceOffered" property is likewise not in the
         vocabulary (also a 404). The forward link to the two Service nodes
         in the @graph below is expressed with hasOfferCatalog + itemOffered
         @id references, which mirrors the "provider" back-reference each
         Service already carries.
         ============================================================ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://sniffy.in/#petgrooming",
        "name": "Sniffy Pet Grooming",
        "url": "https://sniffy.in",
        "image": "https://sniffy.in/images/grooming-session-1.jpg",
        "logo": "https://sniffy.in/sniffy-logo.png",
        "telephone": "+918971313003",
        "email": "care@sniffy.in",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "telephone": "+918971313003",
          "email": "care@sniffy.in",
          "areaServed": "IN",
          "availableLanguage": ["English", "Hindi", "Marathi"]
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Pune",
          "addressRegion": "MH",
          "addressCountry": "IN"
        },
        "areaServed": {
          "@type": "AdministrativeArea",
          "name": "Pune"
        },
        "priceRange": "₹799 - ₹1299",
        "paymentAccepted": "Cash, UPI",
        "currenciesAccepted": "INR",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Pet grooming services in Pune",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": { "@id": "https://sniffy.in/#dog-grooming" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@id": "https://sniffy.in/#cat-grooming" }
            }
          ]
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "5.0",
          "reviewCount": "255",
          "bestRating": "5",
          "worstRating": "1"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "09:00",
          "closes": "21:00"
        },
        "sameAs": [
          "https://www.instagram.com/sniffy.in",
          "https://g.page/r/CdJR67bjxy_gEBI"
        ]
      }
    </script>

    <!-- ============================================================
         STRUCTURED DATA (WEBSITE)

         Names the site as an entity and attributes it to the business
         above. No SearchAction/sitelinks-searchbox: that markup is only
         honoured when the site has a real internal search results URL,
         and this one has none — declaring it would be a false claim.
         ============================================================ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://sniffy.in/#website",
        "url": "https://sniffy.in/",
        "name": "Sniffy",
        "alternateName": "Sniffy Pet Grooming",
        "description": "At-home dog and cat grooming across Pune and Pimpri-Chinchwad.",
        "inLanguage": "en-IN",
        "publisher": { "@id": "https://sniffy.in/#petgrooming" }
      }
    </script>

         The visible copy backing these prices lives in
